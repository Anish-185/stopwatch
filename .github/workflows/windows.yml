name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build, test, and package
        shell: pwsh
        run: ./bin/build-windows.ps1 -Test

      # Starts the packaged app as a user would, with the watch running, and
      # fails if it can't load (a missing DLL or QML module quits at once).
      # It also prints how much CPU it used over ten seconds of counting.
      - name: Run the packaged app
        shell: pwsh
        run: |
          $state = Join-Path $env:LOCALAPPDATA "stopwatch"
          New-Item -ItemType Directory -Force $state | Out-Null
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          Set-Content (Join-Path $state "state.json") "{`"elapsed_ms`":5400000,`"running`":true,`"saved_at`":$now}"
          $p = Start-Process -FilePath dist\stopwatch\stopwatch.exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "stopwatch.exe exited with code $($p.ExitCode)" }
          $p.Refresh(); $before = $p.TotalProcessorTime
          Start-Sleep -Seconds 10
          $p.Refresh()
          if ($p.HasExited) { throw "stopwatch.exe exited with code $($p.ExitCode)" }
          $cpu = ($p.TotalProcessorTime - $before).TotalMilliseconds
          "CPU over 10 s of counting: {0:N0} ms ({1:N2}% of one core), memory {2:N0} MB" -f $cpu, ($cpu / 100), ($p.WorkingSet64 / 1MB)
          Stop-Process -Id $p.Id

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\stopwatch -DestinationPath stopwatch-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: stopwatch-windows-x64
          path: stopwatch-windows-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" stopwatch-windows-x64.zip --title "Stopwatch $env:GITHUB_REF_NAME" --generate-notes
